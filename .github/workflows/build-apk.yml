name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Configure persistent release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.HPLEILA_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.HPLEILA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HPLEILA_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.HPLEILA_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" || -z "${KEY_ALIAS}" || -z "${KEY_PASSWORD}" || -z "${STORE_PASSWORD}" ]]; then
            echo "::error::Release signing is not configured. Add the four HPLeila signing secrets to repository settings; refusing to create an APK signed with a temporary debug key."
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > android/app/hpleila-release.jks
          cat > android/key.properties <<EOF
          storeFile=hpleila-release.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
