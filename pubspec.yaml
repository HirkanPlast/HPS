name: hps
description: فروشگاه هیرکان پلاست - سیستم مدیریت انبار و فروش
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # State management
  provider: ^6.1.2

  # Network (Telegram)
  http: ^1.2.2

  # Local storage
  shared_preferences: ^2.3.2

  # Background tasks (daily backup)
  workmanager: ^0.5.2

  # Persian date
  shamsi_date: ^1.0.2

  # UI helpers
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.8

  # File import
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
